<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iniciar Sesión - Cenaduría Viky</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #128C7E;
            --primary-dark: #075E54;
            --accent: #25D366;
            --surface: #ffffff;
            --background: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.15);
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.4s var(--ease-out);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .logo-box {
            text-align: center;
            margin-bottom: 28px;
        }
        .logo-icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: inline-block;
            filter: drop-shadow(0 4px 12px rgba(37, 211, 102, 0.3));
        }
        .title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
        }
        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 6px;
        }
        .alert-error {
            background: var(--danger-bg);
            border: 1px solid var(--danger);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #cbd5e1;
        }
        .input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: #ffffff;
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out);
        }
        .input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.2);
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(18, 140, 126, 0.4);
            transition: transform 0.15s var(--ease-out), box-shadow 0.15s var(--ease-out);
            margin-top: 8px;
        }
        .btn-submit:hover {
            box-shadow: 0 6px 20px rgba(18, 140, 126, 0.6);
            transform: translateY(-1px);
        }
        .btn-submit:active {
            transform: scale(0.97);
        }
        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-box">
            <div class="logo-icon">🍔</div>
            <h1 class="title">Cenaduría Viky</h1>
            <p class="subtitle">Panel de Pedidos e Impresión</p>
        </div>

        {% if error %}
        <div class="alert-error">
            <span>⚠️</span>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label class="label" for="username">Usuario</label>
                <input type="text" id="username" name="username" class="input" placeholder="Ingresa tu usuario" required autofocus autocomplete="username">
            </div>

            <div class="form-group">
                <label class="label" for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="input" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-submit">
                Entrar al Dashboard →
            </button>
        </form>

        <p class="footer-note">Sistema seguro • Cenaduría Viky</p>
    </div>
</body>
</html>

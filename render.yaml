services:
  - type: web
    name: whatsapp-restaurant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-db
          property: connectionString
      - key: DASHBOARD_USER
        value: "Admin"
      - key: DASHBOARD_PASSWORD
        value: "Amortiguador"
      - key: SECRET_KEY
        value: "viky_secret_session_key_2026_auth"
      - key: OWNER_PHONE
        value: "5214446506790@c.us"

databases:
  - name: whatsapp-db
    databaseName: restaurant
    plan: free
